<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1320">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="גשר קוד">
<meta name="application-name" content="גשר קוד">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="העברת קוד וטקסט בין הטלפון למחשב בזמן אמת">
<title>גשר קוד</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%2316203A'/%3E%3Cg fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M152 172 L84 256 L152 340' stroke='%23E7ECF4' stroke-width='40'/%3E%3Cpath d='M360 172 L428 256 L360 340' stroke='%23E7ECF4' stroke-width='40'/%3E%3Cpath d='M200 214 H312 M284 186 L312 214 L284 242' stroke='%235EE1D9' stroke-width='34'/%3E%3Cpath d='M312 298 H200 M228 270 L200 298 L228 326' stroke='%23F2B65A' stroke-width='34'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="https://i.postimg.cc/Zn0bcgrB/IMG-2243.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D1320; --deep:#131B2B; --deep-2:#182235; --deep-3:#1E2A40; --rule:#22304A; --rule-2:#2E3E5C;
  --paper:#E7ECF4; --mist:#8796AD; --faint:#5C6B84;
  --phone:#5EE1D9; --desk:#F2B65A; --alert:#FF7A6B; --ok:#6BE3A2;
  --sans:"IBM Plex Sans Hebrew", -apple-system, "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --nav-h:52px;
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}

/* The document never scrolls. Every screen scrolls inside itself.
   This removes rubber banding, sideways drift and header jumps on iOS. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--ink)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{
  position:fixed;inset:0;
  font-family:var(--sans);font-size:16px;line-height:1.55;color:var(--paper);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--phone);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Splash */
#splash{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--ink);transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
.splash-inner{display:grid;justify-items:center;gap:18px}
.splash-logo{display:block;width:96px;height:96px;border-radius:24px;animation:breathe 2.4s ease-in-out infinite}
.splash-name{font-weight:700;font-size:22px}
.splash-bar{width:120px;height:3px;border-radius:3px;background:var(--rule);overflow:hidden;position:relative}
.splash-bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:3px;background:linear-gradient(90deg,var(--desk),var(--phone));animation:bar 1.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(94,225,217,0)}50%{box-shadow:0 0 0 10px rgba(94,225,217,.08)}}
@keyframes bar{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

/* Gates: login and denied */
.gate{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(var(--sa-t) + 32px) max(20px,var(--sa-r)) calc(var(--sa-b) + 32px) max(20px,var(--sa-l));
  display:grid;place-items:center;
  background:radial-gradient(50rem 30rem at 100% 0%,rgba(94,225,217,.07),transparent 60%),radial-gradient(40rem 30rem at 0% 100%,rgba(242,182,90,.06),transparent 60%),var(--ink)}
.gate-box{width:100%;max-width:400px;text-align:center}
.gate-logo{display:block;width:76px;height:76px;border-radius:20px;margin:0 auto 22px}
.gate h1{font-size:30px;font-weight:700;line-height:1.2}
.gate .lead{color:var(--mist);margin:10px auto 30px;max-width:30ch}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 20px;border-radius:14px;background:#fff;color:#1F1F1F;font-weight:600;font-size:16px;transition:transform .12s}
.btn-google:active{transform:scale(.98)}
.btn-google:disabled{opacity:.6}
.btn-google svg{width:20px;height:20px}
.gate-note{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;color:var(--faint);font-size:13.5px}
.gate-note .ico{width:16px;height:16px}
.error-box{margin-top:18px;padding:14px 16px;border-radius:12px;text-align:right;background:rgba(255,122,107,.08);border:1px solid rgba(255,122,107,.3);color:#FFC4BC;font-size:14.5px}
.error-box b{display:block;color:var(--alert);margin-bottom:2px}
.error-box code{font-family:var(--mono);font-size:12.5px;color:var(--mist);direction:ltr;unicode-bidi:isolate}
.denied-mark{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:rgba(255,122,107,.1);color:var(--alert)}
.denied-mark .ico{width:30px;height:30px}
.denied-email{margin:6px 0 28px;color:var(--mist);direction:ltr;unicode-bidi:isolate}
.btn-line{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--rule-2);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
.btn-line:active{background:var(--deep)}

/* Navigation stack */
#stack{position:fixed;inset:0;overflow:hidden;background:#070A11}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(50rem 30rem at 100% 0%,rgba(94,225,217,.06),transparent 60%),var(--ink);
  will-change:transform}
.screen.pushed{box-shadow:14px 0 34px rgba(0,0,0,.5)}
.nav{flex:none;position:relative;z-index:2;padding-top:var(--sa-t);
  padding-right:max(6px,var(--sa-r));padding-left:max(6px,var(--sa-l));
  background:rgba(13,19,32,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--rule)}
.nav-in{height:var(--nav-h);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.nav-start{justify-self:start;display:flex;align-items:center;min-width:0}
.nav-end{justify-self:end;display:flex;align-items:center;min-width:0}
.nav-title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;text-align:center}
.nav-logo{display:block;width:32px;height:32px;border-radius:9px;margin:0 8px}
.nav-btn{min-height:44px;min-width:44px;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;gap:4px;color:var(--phone);font-size:16px;font-weight:500;white-space:nowrap}
.nav-btn:active{opacity:.5}
.nav-btn .ico{width:22px;height:22px}
.nav-btn.back .ico{width:24px;height:24px;margin-inline-start:-4px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y}
.content{max-width:680px;margin:0 auto;display:grid;gap:26px;
  padding:20px max(16px,var(--sa-r)) calc(var(--sa-b) + 40px) max(16px,var(--sa-l))}
.lead-text{color:var(--mist);font-size:15px;padding:0 4px}

/* Bridge hero */
.bridge{border-radius:20px;padding:24px 18px 20px;background:linear-gradient(180deg,var(--deep-2),var(--deep));border:1px solid var(--rule)}
.bridge-art{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.bridge-art .node{fill:var(--ink);stroke:var(--rule-2);stroke-width:2;transition:stroke .4s,fill .4s}
.bridge-art .node-ico{fill:none;stroke:var(--faint);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.bridge-art .span{stroke:var(--rule-2);stroke-width:3;fill:none;stroke-linecap:round}
.bridge-art .flow{stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:6 14;opacity:0;transition:opacity .5s}
.bridge-art .node-label{font-family:var(--sans);font-size:15px;font-weight:500;fill:var(--mist);text-anchor:middle}
.bridge.phone-on .n-phone{stroke:var(--phone);fill:rgba(94,225,217,.07)}
.bridge.phone-on .i-phone{stroke:var(--phone)}
.bridge.desk-on .n-desk{stroke:var(--desk);fill:rgba(242,182,90,.07)}
.bridge.desk-on .i-desk{stroke:var(--desk)}
.bridge.live .flow{opacity:1;animation:flow 1.4s linear infinite}
.bridge.live .flow.back{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-40}}
.bridge-status{text-align:center;margin-top:14px}
.bridge-status h2{font-size:21px;font-weight:700;line-height:1.3}
.bridge-status p{color:var(--mist);margin-top:4px;font-size:15px}

/* Install card */
.install-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid rgba(94,225,217,.3);background:linear-gradient(180deg,rgba(94,225,217,.07),rgba(94,225,217,.02)),var(--deep)}
.install-card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(94,225,217,.12);color:var(--phone);flex:none}
.install-card .txt{flex:1;min-width:0}
.install-card .t{font-weight:600}
.install-card .s{font-size:13.5px;color:var(--mist)}
.btn-pill{min-height:40px;padding:0 16px;border-radius:999px;background:var(--phone);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
.btn-pill:active{transform:scale(.97)}
.icon-x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--faint);flex:none}
.icon-x:active{background:var(--deep-2)}

/* Grouped lists, iOS inset style */
.group-title{font-size:13.5px;color:var(--mist);font-weight:500;padding:0 14px 8px}
.group-foot{font-size:13px;color:var(--faint);padding:8px 14px 0}
.group{background:var(--deep);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 16px;text-align:right;position:relative;color:inherit}
.row + .row::before{content:"";position:absolute;top:0;right:16px;left:0;height:1px;background:var(--rule)}
.group.with-ico .row + .row::before{right:64px}
button.row:active{background:var(--deep-2)}
.row-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--deep-2);color:var(--mist)}
.row-ico .ico{width:19px;height:19px}
.row-ico.phone{color:var(--phone)} .row-ico.desk{color:var(--desk)} .row-ico.danger{color:var(--alert);background:rgba(255,122,107,.1)}
.row-main{flex:1;min-width:0}
.row-title{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.row-title span{overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:14.5px;flex:none}
.row-end .chev{width:18px;height:18px}
.row.danger .row-title{color:var(--alert)}
.row.accent .row-title{color:var(--phone)}
.tag{flex:none;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--deep-3);color:var(--mist)}
.status{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--faint);white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.on{color:var(--ok)}
.status.on .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(107,227,162,.14)}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--deep-3);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--phone)}
.footnote{text-align:center;color:var(--faint);font-size:13px}

/* Bottom sheet */
.sheet-backdrop{position:fixed;inset:0;z-index:70;background:rgba(3,6,12,.55);opacity:0;transition:opacity .28s}
.sheet-backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;margin:0 auto;max-width:560px;
  padding:0 max(10px,var(--sa-r)) calc(10px + var(--sa-b)) max(10px,var(--sa-l));
  transform:translateY(110%);transition:transform .32s var(--ease)}
.sheet.open{transform:none}
.sheet-card{background:var(--deep-2);border:1px solid var(--rule-2);border-radius:18px;overflow:hidden}
.sheet-head{padding:18px 20px 14px;text-align:center}
.sheet-title{font-weight:700;font-size:17px}
.sheet-msg{color:var(--mist);font-size:14.5px;margin-top:4px}
.sheet-body{padding:0 18px 16px}
.sheet-action{display:block;width:100%;min-height:56px;padding:0 16px;font-size:17px;font-weight:500;color:var(--phone);border-top:1px solid var(--rule-2)}
.sheet-action:active{background:var(--deep-3)}
.sheet-action.danger{color:var(--alert)}
.sheet-action:disabled{color:var(--faint)}
.sheet-cancel{margin-top:8px;border:1px solid var(--rule-2);border-radius:18px;background:var(--deep-2);font-weight:600;color:var(--paper)}
.input{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--rule-2);background:var(--ink);color:var(--paper);font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--phone)}
.input.invalid{border-color:var(--alert)}
.input-hint{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;color:var(--faint);min-height:18px}
.input-hint [data-err]{color:var(--alert)}
.steps-list{list-style:none;display:grid;gap:12px;text-align:right}
.steps-list li{display:flex;align-items:center;gap:12px;font-size:15.5px}
.steps-list .num{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--deep-3);color:var(--phone)}
.steps-list .ico{color:var(--phone)}

/* Toast, network, update */
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sa-b));z-index:80;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:var(--paper);color:var(--ink);font-weight:600;font-size:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ico{width:18px;height:18px}
.net-banner{position:fixed;top:calc(var(--sa-t) + var(--nav-h) + 10px);left:50%;transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:#2A1D1F;border:1px solid rgba(255,122,107,.35);
  color:#FFC4BC;font-size:14px;font-weight:500;white-space:nowrap}
.net-banner .ico{width:18px;height:18px;color:var(--alert)}
.update-bar{position:fixed;left:50%;bottom:calc(24px + var(--sa-b));transform:translateX(-50%);z-index:79;
  display:flex;align-items:center;gap:14px;padding:8px 8px 8px 8px;padding-inline-start:18px;border-radius:16px;
  background:var(--deep-2);border:1px solid var(--rule-2);box-shadow:0 10px 30px rgba(0,0,0,.45);white-space:nowrap;font-size:15px}
.update-bar button{background:var(--phone);color:var(--ink);font-weight:600;min-height:40px;padding:0 14px;border-radius:12px;display:flex;align-items:center;gap:8px}
.update-bar .ico{width:16px;height:16px}


/* Stage 2: quick bridge */
.bridge{padding:18px 14px 16px}
.bridge-art{max-width:420px}
.bridge-status h2{font-size:19px}
.composer{display:grid;gap:10px}
.btn-hero{width:100%;display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;text-align:right;
  background:linear-gradient(135deg,rgba(94,225,217,.16),rgba(94,225,217,.04));border:1px solid rgba(94,225,217,.35);transition:transform .12s}
.btn-hero:active{transform:scale(.99)}
.btn-hero .hi{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--phone);color:var(--ink);flex:none}
.btn-hero .hi .ico{width:24px;height:24px}
.btn-hero .ht{display:block;font-size:18px;font-weight:700}
.btn-hero .hs{display:block;font-size:13.5px;color:var(--mist);line-height:1.4;margin-top:2px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-sec{min-height:50px;border-radius:14px;border:1px solid var(--rule-2);background:var(--deep);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px}
.btn-sec:active{background:var(--deep-2)}
.paste-zone{display:block;width:100%;height:58px;resize:none;border-radius:14px;border:1.5px dashed var(--rule-2);background:transparent;
  color:transparent;caret-color:transparent;font:inherit;font-size:16px;line-height:24px;padding:16px;text-align:center;outline:none;overflow:hidden}
.paste-zone::placeholder{color:var(--faint);font-size:14.5px}
.paste-zone:focus,.paste-zone.over{border-color:var(--phone);background:rgba(94,225,217,.05)}
.staged{border-radius:18px;border:1px solid rgba(94,225,217,.35);background:var(--deep-2);padding:16px;display:grid;gap:14px}
.staged-head{display:flex;align-items:center;gap:12px}
.type-ico{min-width:46px;height:46px;padding:0 6px;border-radius:12px;display:grid;place-items:center;background:var(--deep-3);color:var(--phone);flex:none;font-family:var(--mono);font-size:12px;font-weight:500;direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--deep-3);color:var(--mist);white-space:nowrap}
.chip.type{color:var(--phone);background:rgba(94,225,217,.1)}
.chip.warn{color:var(--desk);background:rgba(242,182,90,.12)}
.chip .ico{width:13px;height:13px}
.actions-2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.btn-primary{min-height:52px;border-radius:14px;background:var(--phone);color:var(--ink);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:active{transform:scale(.99)}
.btn-primary:disabled{opacity:.7}
.btn-ghost{min-height:52px;border-radius:14px;border:1px solid var(--rule-2);font-weight:600}
.btn-ghost:active{background:var(--deep-3)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(13,19,32,.25);border-top-color:var(--ink);animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 10px}
.section-head h2{font-size:17px;font-weight:700}
.link-btn{color:var(--phone);font-size:14.5px;font-weight:500;min-height:40px;padding:0 6px}
.link-btn.danger{color:var(--alert)}
.clips{display:grid;gap:10px}
.clip{border-radius:16px;border:1px solid var(--rule);background:var(--deep);padding:14px;display:grid;gap:10px;transition:border-color .6s,box-shadow .6s}
.clip.fresh{border-color:var(--phone);box-shadow:0 0 0 3px rgba(94,225,217,.12)}
.clip[draggable="true"]{cursor:grab}
.clip-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--mist)}
.clip-from{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip-from .ico{width:16px;height:16px;flex:none}
.clip-name{font-weight:600;font-size:15.5px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip-preview{font-family:var(--mono);font-size:12.5px;line-height:1.55;color:#AEB9CB;background:var(--ink);border-radius:10px;padding:10px 12px;
  direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:6.4em;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.clip-actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.btn-copy{min-height:48px;border-radius:12px;background:rgba(94,225,217,.12);color:var(--phone);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-copy:active{background:rgba(94,225,217,.2)}
.btn-copy.done{background:rgba(107,227,162,.14);color:var(--ok)}
.btn-more{width:48px;min-height:48px;border-radius:12px;border:1px solid var(--rule-2);display:grid;place-items:center;color:var(--mist)}
.btn-more:active{background:var(--deep-2)}
.empty-card{border:1.5px dashed var(--rule);border-radius:16px;padding:22px 18px;text-align:center;color:var(--faint);font-size:14.5px}
.finds{display:grid;gap:8px;max-height:42vh;overflow:auto;text-align:right}
.find{display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:var(--ink)}
.find b{font-size:14.5px}
.find code{font-family:var(--mono);font-size:12px;color:var(--mist);direction:ltr;unicode-bidi:isolate;text-align:right}
.find small{color:var(--faint);font-size:12.5px}
.textarea{display:block;width:100%;min-height:170px;max-height:40vh;resize:none;padding:12px 14px;border-radius:12px;border:1px solid var(--rule-2);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:16px;line-height:1.5;outline:none}
.textarea:focus{border-color:var(--phone)}
.details{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px;text-align:right}
.details dt{color:var(--faint)}

/* Stage 3: files and versions */
.field-l{display:block;font-size:14px;color:var(--mist);margin:14px 0 6px;text-align:right}
.sheet-body .field-l:first-child{margin-top:0}
.pick-row{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;touch-action:pan-x}
.pick-row::-webkit-scrollbar{display:none}
.chip.pick{min-height:32px;padding:0 12px;border:1px solid var(--rule-2);background:var(--deep);color:var(--paper);font-size:13.5px;flex:none}
.chip.pick:active{background:var(--deep-3)}
.chip.add,.diff-add{color:var(--ok)} .chip.del,.diff-del{color:var(--alert)}
.chip.add{background:rgba(107,227,162,.1)} .chip.del{background:rgba(255,122,107,.1)}
.diff-add,.diff-del{font-family:var(--mono);font-size:12.5px}
.match{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px;border-radius:12px;background:rgba(94,225,217,.08);border:1px solid rgba(94,225,217,.25);font-size:14px;text-align:right;color:var(--paper)}
.match .ico{color:var(--phone);margin-top:2px}
.suggest{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:rgba(94,225,217,.08);border:1px solid rgba(94,225,217,.25);font-size:14px}
.suggest .ico{color:var(--phone);margin-top:2px;flex:none}
.suggest b{font-weight:600}
.suggest .link-btn{min-height:28px;padding:0;margin-top:2px;display:block}
.actions-3{display:grid;gap:10px}
.actions-3 .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-secondary{min-height:52px;border-radius:14px;border:1px solid rgba(94,225,217,.35);background:rgba(94,225,217,.08);color:var(--phone);font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-secondary:active{background:rgba(94,225,217,.16)}
.btn-text{min-height:40px;color:var(--mist);font-weight:500}
.row-ico.ext{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--phone);direction:ltr}
.vnum{font-family:var(--mono);font-size:13px;font-weight:500}
.item-head{border-radius:18px;border:1px solid var(--rule);background:var(--deep);padding:16px;display:grid;gap:12px}
.item-actions{display:grid;gap:10px}
.btn-primary.big{min-height:56px;font-size:17px}
.muted{color:var(--faint);font-size:13.5px}
.input.search{min-height:46px}
.sheet{display:flex;flex-direction:column}
.sheet-card{overflow-y:auto;min-height:0;overscroll-behavior:contain}
.spin.dark{border-color:rgba(231,236,244,.25);border-top-color:var(--paper)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  getRedirectResult, onAuthStateChanged, signOut,
  setPersistence, browserLocalPersistence, indexedDBLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getDatabase, ref, update, onValue, onDisconnect, serverTimestamp,
  push as dbPush, get, query, orderByKey, limitToLast
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const APP_VERSION = "1.3.0";

/* ================= Firebase ================= */
const app = initializeApp({
  apiKey: "AIzaSyAjCSGjHYVVAnxfECVTqTUPcp9Ld7OfZiE",
  authDomain: "my-code-shere.firebaseapp.com",
  databaseURL: "https://my-code-shere-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "my-code-shere",
  messagingSenderId: "356254570125",
  appId: "1:356254570125:web:a9237baf9d748b1d4d74c4"
});
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });
const persistenceReady = setPersistence(auth, indexedDBLocalPersistence)
  .catch(() => setPersistence(auth, browserLocalPersistence))
  .catch(() => {});

/* ================= Helpers ================= */
const $ = (s, root = document) => root.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (UA.includes("Macintosh") && navigator.maxTouchPoints > 1);
const wait = (ms) => new Promise(r => setTimeout(r, ms));

let toastTimer;
function toast(text) {
  $("#toast-text").textContent = text;
  const t = $("#toast");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

// RTDB queues writes while offline and the promise waits for the server.
// Never let the UI hang on that: after a short wait, treat it as queued.
async function dbWrite(promise) {
  const result = await Promise.race([promise.then(() => "saved"), wait(5000).then(() => "queued")]);
  return result;
}

let splashGone = false;
const splashStart = performance.now();
function hideSplash() {
  if (splashGone) return;
  splashGone = true;
  setTimeout(() => $("#splash").classList.add("out"), Math.max(0, 450 - (performance.now() - splashStart)));
}
setTimeout(hideSplash, 6000);

/* ================= Device identity ================= */
function getDeviceId() {
  let id = store.get("cb.deviceId");
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, "");
    store.set("cb.deviceId", id);
  }
  return id;
}
function detectDevice() {
  let name = "מחשב", kind = "desktop";
  if (/iPhone/.test(UA)) { name = "iPhone"; kind = "mobile"; }
  else if (/iPad/.test(UA) || (UA.includes("Macintosh") && navigator.maxTouchPoints > 1)) { name = "iPad"; kind = "tablet"; }
  else if (/Android/.test(UA)) { const m = /Mobile/.test(UA); name = m ? "Android" : "טאבלט Android"; kind = m ? "mobile" : "tablet"; }
  else if (/Windows/.test(UA)) name = "מחשב Windows";
  else if (/Macintosh/.test(UA)) name = "Mac";
  else if (/Linux/.test(UA)) name = "מחשב Linux";
  return { name, kind, mode: isStandalone ? "app" : "browser" };
}
const DEVICE_ID = getDeviceId();
const DEVICE = detectDevice();
const userRoot = () => auth.currentUser ? `users/${auth.currentUser.uid}` : null;

/* ================= App state ================= */
const state = { devices: {}, clips: [], items: [], connected: false, serverOffset: 0 };
const freshClips = new Set();
const rtf = new Intl.RelativeTimeFormat("he", { numeric: "auto" });
function ago(ts) {
  if (!ts) return "";
  const sec = Math.round((ts - (Date.now() + state.serverOffset)) / 1000);
  const a = Math.abs(sec);
  if (a < 60) return "לפני רגע";
  if (a < 3600) return rtf.format(Math.round(sec / 60), "minute");
  if (a < 86400) return rtf.format(Math.round(sec / 3600), "hour");
  return rtf.format(Math.round(sec / 86400), "day");
}
const displayName = (d) => d.customName || d.name || "מכשיר";
function deviceList() {
  return Object.entries(state.devices).map(([id, d]) => ({ id, ...d }))
    .sort((a, b) => (b.id === DEVICE_ID) - (a.id === DEVICE_ID) || (!!b.online - !!a.online) || ((b.lastSeen || 0) - (a.lastSeen || 0)));
}
const deviceIcon = (d) => d.kind === "desktop" ? "i-desktop" : d.kind === "tablet" ? "i-tablet" : "i-phone";
const deviceTone = (d) => d.kind === "desktop" ? "desk" : "phone";
const statusText = (d) => d.online ? "מחובר" : ago(d.lastSeen);

/* ================= Bottom sheet ================= */
const sheetEl = $("#sheet"), backdrop = $("#sheet-backdrop");
let sheetOpen = false;

function openSheet({ title = "", message = "", body = "", actions = [], cancel = "ביטול" }) {
  const head = (title || message)
    ? `<div class="sheet-head">${title ? `<div class="sheet-title" id="sheet-title">${esc(title)}</div>` : ""}${message ? `<div class="sheet-msg">${esc(message)}</div>` : ""}</div>` : "";
  sheetEl.innerHTML = `
    <div class="sheet-card" role="dialog" aria-modal="true" ${title ? 'aria-labelledby="sheet-title"' : ""}>
      ${head}
      ${body ? `<div class="sheet-body">${body}</div>` : ""}

const NAME_MIN = 3, NAME_MAX = 80, PROJECT_MAX = 40, NOTE_MAX = 120;
function hashStr(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

  }
  const set = lineHashSet(a.text);
  if (set.size < 3) return null;

  const vid = dbPush(ref(db, `${root}/versionsMeta/${itemId}`)).key;

    try { diff = lineDiff(await fetchRel(`versionsBody/${item.id}/${item.latest.vid}`), a.text); } catch {}
  }
  const n = (item?.seq || 0) + 1;
  const me = state.devices[DEVICE_ID];

  const vmeta = {
    n, chars: a.chars, lines: a.lines, bytes: a.bytes, from: DEVICE_ID, fromName, fromKind: DEVICE.kind, createdAt: now,
    preview: makePreview(a.text, a.findings), flagged: a.findings.length,

  if (a.findings.length) reviewFindings(a.findings, open, "המשך לשמירה"); else open();
}

async function deleteVersion(item, v, versions) {
  const remaining = versions.filter(x => x.id !== v.id);
  if (!remaining.length) return;
  const patch = {
    [`versionsMeta/${item.id}/${v.id}`]: null, [`versionsBody/${item.id}/${v.id}`]: null,
    [`items/${item.id}/count`]: remaining.length,
    [`items/${item.id}/totalBytes`]: Math.max(0, (item.totalBytes || 0) - (v.bytes || 0))
  };
  if (item.latest?.vid === v.id) {
    const nv = remaining[0];
    patch[`items/${item.id}/latest`] = { vid: nv.id, n: nv.n, chars: nv.chars, lines: nv.lines, bytes: nv.bytes, createdAt: nv.createdAt, from: nv.from, fromName: nv.fromName || "" };
  }
  const r = await dbWrite(update(ref(db, userRoot()), patch));
  bodyCache.delete(`versionsBody/${item.id}/${v.id}`);
  toast(r === "saved" ? `גרסה ${v.n} נמחקה` : "יימחק כשהחיבור יחזור");
}
async function pruneVersions(item, versions, keep = 3) {
  const drop = versions.slice(keep);
  if (!drop.length) return;
  const patch = {};
  let freed = 0;
  drop.forEach(v => { patch[`versionsMeta/${item.id}/${v.id}`] = null; patch[`versionsBody/${item.id}/${v.id}`] = null; freed += v.bytes || 0; });
  patch[`items/${item.id}/count`] = versions.length - drop.length;
  patch[`items/${item.id}/totalBytes`] = Math.max(0, (item.totalBytes || 0) - freed);
  const r = await dbWrite(update(ref(db, userRoot()), patch));
  toast(r === "saved" ? `פונו ${fmtBytes(freed)}` : "יימחק כשהחיבור יחזור");
}
async function deleteItem(item) {
  const r = await dbWrite(update(ref(db, userRoot()), { [`items/${item.id}`]: null, [`versionsMeta/${item.id}`]: null, [`versionsBody/${item.id}`]: null }));
  toast(r === "saved" ? "הקובץ נמחק" : "יימחק כשהחיבור יחזור");
}

    body: `<dl class="details"><dt>תווים</dt><dd>${nf.format(v.chars || 0)}</dd><dt>שורות</dt><dd>${nf.format(v.lines || 0)}</dd><dt>גודל</dt><dd dir="ltr" style="text-align:right">${fmtBytes(v.bytes)}</dd>

    ]
  });
}

function buildFiles(s) {
  s.content.innerHTML = `

  s.content.addEventListener("click", (e) => { const r = e.target.closest("[data-item]"); if (r) push("item", { id: r.dataset.item }); });
  s.update = () => {
    const term = normKey(q.value);
    const items = state.items.filter(it => !term || normKey(it.name).includes(term) || normKey(it.project).includes(term));
    const box = $('[data-ref="list"]', s.content);
    if (!state.items.length) { box.innerHTML = `<div class="empty-card">עדיין אין קבצים. מדביקים בדף הבית ובוחרים "שמירה כקובץ".</div>`; return; }
    if (!items.length) { box.innerHTML = `<div class="empty-card">לא נמצא קובץ שמתאים לחיפוש.</div>`; return; }
    const groups = new Map();
    for (const it of items) { const k = normKey(it.project); if (!groups.has(k)) groups.set(k, { name: it.project, list: [] }); groups.get(k).list.push(it); }

        <div class="group-title">${esc(g.name)} <span style="color:var(--faint)">(${g.list.length})</span></div>

}

function buildItem(s, params) {
  const id = params.id;
  let versions = [], loaded = false;
  s.end.innerHTML = `<button class="nav-btn" type="button" data-act="menu" aria-label="אפשרויות"><svg class="ico"><use href="#i-more"/></svg></button>`;
  s.content.innerHTML = `
    <section class="item-head" data-ref="head"></section>
    <section class="item-actions">
      <button class="btn-primary big" type="button" data-act="copy-latest"><svg class="ico"><use href="#i-copy"/></svg><span>העתקת הגרסה האחרונה</span></button>
      <div class="btn-row">
        <button class="btn-sec" type="button" data-act="paste-version"><svg class="ico"><use href="#i-clipboard"/></svg>הדבקת גרסה חדשה</button>
        <button class="btn-sec" type="button" data-act="file-version"><svg class="ico"><use href="#i-file"/></svg>גרסה מקובץ</button>
      </div>
      <input type="file" data-ref="file" hidden>
    </section>
    <section>
      <div class="section-head"><h2>גרסאות</h2><span class="muted" data-ref="total"></span></div>
      <div class="group with-ico" data-ref="versions"></div>
    </section>`;
  const fileInput = $('[data-ref="file"]', s.content);
  const item = () => state.items.find(it => it.id === id);
  const unsub = onValue(query(ref(db, `${userRoot()}/versionsMeta/${id}`), orderByKey(), limitToLast(100)), (snap) => {
    versions = Object.entries(snap.val() || {}).map(([vid, v]) => ({ id: vid, ...v })).sort((a, b) => (a.id < b.id ? 1 : -1));
    loaded = true; s.update();
  }, onDbError);
  s.destroy = () => { try { unsub(); } catch {} };
  const it0 = item();
  if (it0?.latest?.vid && (it0.latest.chars || 0) <= 500000) fetchRel(`versionsBody/${id}/${it0.latest.vid}`).catch(() => {});

  s.end.addEventListener("click", () => { const it = item(); if (it) itemMenu(it, versions); });
  s.content.addEventListener("pointerdown", (e) => {
    const it = item();
    if (it?.latest?.vid && e.target.closest('[data-act="copy-latest"]')) fetchRel(`versionsBody/${id}/${it.latest.vid}`).catch(() => {});
  });
  s.content.addEventListener("click", async (e) => {
    const it = item(); if (!it) return;
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "copy-latest") return copyRel(`versionsBody/${id}/${it.latest.vid}`, e.target.closest("[data-act]"));
    if (act === "paste-version") {
      if (!navigator.clipboard?.readText) { toast("הדפדפן לא מאפשר קריאה מהלוח, אפשר להשתמש בגרסה מקובץ"); return; }
      try { newVersionFor(it, await navigator.clipboard.readText()); } catch { toast("אין הרשאה ללוח"); }
      return;
    }
    if (act === "file-version") return fileInput.click();
    const row = e.target.closest("[data-version]");
    if (row) { const v = versions.find(x => x.id === row.dataset.version); if (v) versionSheet(it, v, versions); }
  });
  fileInput.addEventListener("change", async () => {
    const f = fileInput.files?.[0]; fileInput.value = "";
    const it = item(); if (!f || !it) return;
    if (f.size > MAX_FILE_BYTES) { toast("הקובץ גדול מדי"); return; }
    const text = await f.text();
    if (/\u0000/.test(text.slice(0, 8000))) { toast("קובץ בינארי לא נתמך"); return; }
    newVersionFor(it, text, f.name);
  });

  s.update = () => {
    const it = item();
    if (!it) {
      $('[data-ref="head"]', s.content).innerHTML = `<div class="empty-card">הקובץ נמחק.</div>`;
      $(".item-actions", s.content).hidden = true;
      $('[data-ref="versions"]', s.content).innerHTML = "";
      return;
    }
    s.setTitle(it.name);
    const L = it.latest || {};
    $('[data-ref="head"]', s.content).innerHTML = `
      <div class="staged-head">
        <div class="type-ico">${itemIcon(it)}</div>
        <div class="row-main">
          <div class="row-title" style="font-size:18px;font-weight:700"><span dir="auto">${esc(it.name)}</span></div>
          <div class="row-sub">${esc(it.project)}</div>
        </div>
      </div>
      <div class="chips">
        <span class="chip type">${esc(it.type || "טקסט")}</span>
        <span class="chip">גרסה ${L.n || 1}</span>
        <span class="chip">${nf.format(L.chars || 0)} תווים</span>
        <span class="chip">${nf.format(L.lines || 0)} שורות</span>
        <span class="chip" dir="ltr">${fmtBytes(L.bytes)}</span>
      </div>
      <div class="row-sub">עודכן ${esc(ago(it.updatedAt))}, ${L.from === DEVICE_ID ? "מהמכשיר הזה" : `מהמכשיר ${esc(L.fromName || "")}`}</div>`;
    $('[data-ref="total"]', s.content).textContent = `${fmtBytes(it.totalBytes)} בסך הכל`;
    $('[data-ref="versions"]', s.content).innerHTML = !loaded
      ? `<div class="row"><div class="row-main"><div class="row-sub">טוען גרסאות</div></div></div>`
      : versions.map(v => `<button class="row" type="button" data-version="${esc(v.id)}">
          <div class="row-ico ${v.id === L.vid ? "phone" : ""}"><span class="vnum">${v.n}</span></div>
          <div class="row-main">
            <div class="row-title"><span>גרסה ${v.n}</span>${v.id === L.vid ? `<span class="tag">אחרונה</span>` : ""}</div>
            <div class="row-sub">${esc(v.note ? v.note : `${ago(v.createdAt)}, ${v.from === DEVICE_ID ? "מהמכשיר הזה" : v.fromName || ""}`)}</div>
          </div>
          <div class="row-end">${v.added != null ? `<span class="diff-add" dir="ltr">+${nf.format(v.added)}</span><span class="diff-del" dir="ltr">−${nf.format(v.removed)}</span>` : `<span>${nf.format(v.lines || 0)} שורות</span>`}<svg class="ico chev"><use href="#i-chev-fwd"/></svg></div>
        </button>`).join("");
  };
}

  const zone = $('[data-ref="zone"]', s.content);
  const fileInput = $('[data-ref="file"]', s.content);

  $('[data-go="settings"]', s.end).addEventListener("click", () => push("settings"));
  zone.addEventListener("paste", (e) => {
    e.preventDefault(); e.stopPropagation();
    const files = e.clipboardData?.files;
    zone.value = ""; zone.blur();
    if (files && files.length) { readFiles(files); return; }
    stage(e.clipboardData?.getData("text/plain") || "");
  });
  zone.addEventListener("input", () => { const t = zone.value; zone.value = ""; if (t.trim()) { zone.blur(); stage(t); } });
  zone.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); zone.classList.add("over"); } });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", (e) => { zone.classList.remove("over"); if (hasFiles(e)) { e.preventDefault(); e.stopPropagation(); readFiles(e.dataTransfer.files); } });
  fileInput.addEventListener("change", () => { readFiles(fileInput.files); fileInput.value = ""; });

  s.content.addEventListener("pointerdown", (e) => {
    const card = e.target.closest("[data-clip]");
    if (card && e.target.closest("[data-copy]")) fetchBody(card.dataset.clip).catch(() => {});
  });
  if (IS_DESKTOP) {
    s.content.addEventListener("mouseover", (e) => { const card = e.target.closest("[data-clip]"); if (card) fetchBody(card.dataset.clip).catch(() => {}); });
    s.content.addEventListener("dragstart", (e) => {
      const card = e.target.closest("[data-clip]");
      if (!card) return;
      const c = state.clips.find(x => x.id === card.dataset.clip);
      const t = c && bodyCache.get(clipKey(c.id));
      if (t == null) { e.preventDefault(); if (c) fetchBody(c.id).catch(() => {}); toast("התוכן נטען, אפשר לגרור שוב"); return; }
      e.dataTransfer.effectAllowed = "copy";
      e.dataTransfer.setData("text/plain", t);
      try {
        const url = URL.createObjectURL(new Blob([t], { type: "text/plain" }));
        e.dataTransfer.setData("DownloadURL", `text/plain:${fileNameFor(c)}:${url}`);
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch {}
    });
  }

  s.content.addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "paste") return pasteFromClipboard();
    if (act === "file") return fileInput.click();
    if (act === "write") return openWrite();
    if (act === "send") return sendStaged();
    if (act === "discard") return discardStaged();
    if (act === "save" && staged) return openSaveForm(staged);
    if (act === "save-suggested" && staged?.suggest) return openSaveForm(staged, { project: staged.suggest.item.project, name: staged.suggest.item.name });
    if (act === "not-this" && staged) { staged.suggest = null; return s.update(); }
    if (e.target.closest('[data-go="files"]')) return push("files");
    const itemRowEl = e.target.closest("[data-item]");
    if (itemRowEl) return push("item", { id: itemRowEl.dataset.item });
    if (act === "review") return reviewFindings(staged?.findings);
    if (act === "clear") return confirmClearAll();
    if (act === "install") return doInstall();
    if (act === "dismiss") { store.set("cb.installDismissed", "1"); return s.update(); }
    if (e.target.closest('[data-go="devices"]')) return push("devices");
    const card = e.target.closest("[data-clip]");
    if (!card) return;
    const c = state.clips.find(x => x.id === card.dataset.clip);
    if (!c) return;
    if (e.target.closest("[data-copy]")) copyClip(c, e.target.closest("[data-copy]"));
    else if (e.target.closest("[data-more]")) clipActions(c);
  });

  s.update = () => {
    const list = deviceList();
    const phoneOn = list.some(d => d.online && d.kind !== "desktop");
    const deskOn = list.some(d => d.online && d.kind === "desktop");
    const br = $('[data-ref="bridge"]', s.content);
    br.classList.toggle("phone-on", phoneOn);
    br.classList.toggle("desk-on", deskOn);
    br.classList.toggle("live", phoneOn && deskOn);
    let t, x;
    if (!state.connected && !phoneOn && !deskOn) { t = "מתחבר לשרת"; x = "רגע אחד."; }
    else if (phoneOn && deskOn) { t = "הגשר פעיל"; x = "הטלפון והמחשב מחוברים, כל שליחה מגיעה מיד."; }
    else if (phoneOn) { t = "ממתין למחשב"; x = "אפשר לשלוח כבר עכשיו, זה יחכה למחשב."; }
    else if (deskOn) { t = "ממתין לטלפון"; x = "אפשר לשלוח כבר עכשיו, זה יחכה לטלפון."; }
    else { t = "אין מכשירים מחוברים"; x = "החיבור לשרת פעיל."; }
    $('[data-ref="bt"]', s.content).textContent = t;
    $('[data-ref="bx"]', s.content).textContent = x;

    $('[data-ref="install"]', s.content).hidden = !(canInstall() && !store.get("cb.installDismissed"));

    // Composer or staged item
    const st = $('[data-ref="staged"]', s.content);
    $('[data-ref="composer"]', s.content).hidden = !!staged;
    st.hidden = !staged;
    if (staged) {
      const f = staged.findings.length;
      const sug = staged.suggest;
      st.innerHTML = `
        <div class="staged-head">
          <div class="type-ico">${esc((staged.ext || "txt").toUpperCase())}</div>
          <div class="row-main">
            <div class="row-title"><span ${staged.name ? 'dir="ltr"' : ""}>${esc(staged.name || staged.type)}</span></div>
            <div class="row-sub">מוכן לשליחה. התוכן לא מוצג כדי לשמור על מהירות.</div>
          </div>
        </div>
        <div class="chips">
          <span class="chip type">${esc(staged.type)}</span>
          <span class="chip">${nf.format(staged.chars)} תווים</span>
          <span class="chip">${nf.format(staged.lines)} שורות</span>
          <span class="chip" dir="ltr">${fmtBytes(staged.bytes)}</span>
          ${f ? `<button class="chip warn" type="button" data-act="review"><svg class="ico"><use href="#i-alert"/></svg>${f === 1 ? "פרט רגיש אחד" : `${f} פרטים רגישים`}</button>` : ""}
        </div>
        ${sug ? `<div class="suggest"><svg class="ico"><use href="#i-layers"/></svg><div>
            נראה כמו גרסה חדשה של <b dir="auto">${esc(sug.item.name)}</b>, בפרויקט <b>${esc(sug.item.project)}</b>.
            <button class="link-btn" type="button" data-act="not-this">זה לא הקובץ הזה</button></div></div>` : ""}
        <div class="actions-3">
          <div class="pair">
            ${sug
              ? `<button class="btn-primary" type="button" data-act="save-suggested" ${sending ? "disabled" : ""}><svg class="ico"><use href="#i-layers"/></svg>שמירה כגרסה ${(sug.item.seq || 0) + 1}</button>
                 <button class="btn-secondary" type="button" data-act="send" ${sending ? "disabled" : ""}>${sending ? `<span class="spin dark"></span>שולח` : `<svg class="ico"><use href="#i-send"/></svg>שליחה מהירה`}</button>`
              : `<button class="btn-primary" type="button" data-act="send" ${sending ? "disabled" : ""}>${sending ? `<span class="spin"></span>שולח` : `<svg class="ico"><use href="#i-send"/></svg>שליחה מהירה`}</button>
                 <button class="btn-secondary" type="button" data-act="save" ${sending ? "disabled" : ""}><svg class="ico"><use href="#i-layers"/></svg>שמירה כקובץ</button>`}
          </div>
          <button class="btn-text" type="button" data-act="discard" ${sending ? "disabled" : ""}>ביטול</button>
        </div>`;
    }

    // Received list
    const clips = state.clips;
    $('[data-ref="clear"]', s.content).hidden = clips.length === 0;
    $('[data-ref="clips"]', s.content).innerHTML = clips.length
      ? clips.map(clipCard).join("")
      : `<div class="empty-card">${state.connected ? "עדיין לא נשלח כלום. מה שתשלח מכל מכשיר יופיע כאן, בכל המכשירים, בלי רענון." : "טוען"}</div>`;

    // Files preview
    const recent = state.items.slice(0, 3).map(itemRow).join("");
    $('[data-ref="files"]', s.content).innerHTML = (recent || `<div class="row"><div class="row-main"><div class="row-sub">עדיין אין קבצים. אחרי הדבקה בוחרים "שמירה כקובץ".</div></div></div>`) + `
      <button class="row accent" type="button" data-go="files">
        <div class="row-ico"><svg class="ico"><use href="#i-folder"/></svg></div>
        <div class="row-main"><div class="row-title"><span>כל הקבצים</span></div></div>
        <div class="row-end">${state.items.length || ""}<svg class="ico chev"><use href="#i-chev-fwd"/></svg></div>
      </button>`;

    // Devices preview
    const preview = list.slice(0, 3).map(d => deviceRow(d, false)).join("");
    const empty = `<div class="row"><div class="row-main"><div class="row-sub">${state.connected ? "עדיין אין מכשירים" : "טוען מכשירים"}</div></div></div>`;
    $('[data-ref="devs"]', s.content).innerHTML = (preview || empty) + `
      <button class="row accent" type="button" data-go="devices">
        <div class="row-ico"><svg class="ico"><use href="#i-devices"/></svg></div>
        <div class="row-main"><div class="row-title"><span>ניהול מכשירים</span></div></div>
        <div class="row-end">${list.length || ""}<svg class="ico chev"><use href="#i-chev-fwd"/></svg></div>
      </button>`;
  };
}

/* ================= Actions ================= */
function deviceActions(d) {
  const isMe = d.id === DEVICE_ID;
  const canRemove = !isMe && !d.online;
  let msg = d.online ? "מחובר עכשיו" : `נראה לאחרונה ${ago(d.lastSeen)}`;
  if (!canRemove) msg += isMe ? ". אי אפשר להסיר את המכשיר הנוכחי." : ". אפשר להסיר רק מכשיר לא מחובר.";
  openSheet({
    title: displayName(d), message: msg,
    actions: [
      { label: "שינוי שם", onClick: () => renameDevice(d) },
      { label: "הסרה מהרשימה", style: "danger", disabled: !canRemove, onClick: () => confirmRemove(d) }
    ]
  });
}
function renameDevice(d) {
  openPrompt({
    title: "שינוי שם המכשיר",
    message: "השם יופיע בכל המכשירים שלך.",
    value: displayName(d), placeholder: "לדוגמה: המחשב בעבודה", min: 2, max: 24,
    onSave: async (v) => {
      const r = await dbWrite(update(ref(db, `${userRoot()}/presence/${d.id}`), { customName: v }));
      if (r === "saved") toast("השם עודכן");
      return r;
    }
  });
}
function confirmRemove(d) {
  openSheet({
    title: `להסיר את ${displayName(d)}?`,
    message: "המכשיר יחזור לרשימה אוטומטית בפעם הבאה שיתחבר.",
    actions: [{ label: "הסרה", style: "danger", onClick: async () => {
      const r = await dbWrite(update(ref(db, `${userRoot()}/presence`), { [d.id]: null }));
      toast(r === "saved" ? "המכשיר הוסר" : "יוסר כשהחיבור יחזור");
    } }]
  });
}
function confirmCleanInactive() {
  const ids = deviceList().filter(d => !d.online && d.id !== DEVICE_ID).map(d => d.id);
  if (!ids.length) return;
  openSheet({
    title: ids.length === 1 ? "להסיר מכשיר לא פעיל?" : `להסיר ${ids.length} מכשירים לא פעילים?`,
    message: "מכשירים מחוברים והמכשיר הנוכחי לא יוסרו.",
    actions: [{ label: "הסרה", style: "danger", onClick: async () => {
      const patch = Object.fromEntries(ids.map(id => [id, null]));
      const r = await dbWrite(update(ref(db, `${userRoot()}/presence`), patch));
      toast(r === "saved" ? "המכשירים הוסרו" : "יוסרו כשהחיבור יחזור");
    } }]
  });
}
function confirmLogout() {
  openSheet({
    title: "להתנתק מגשר קוד?",
    message: "המכשיר הזה יוצג כלא מחובר עד הכניסה הבאה.",
    actions: [{ label: "התנתקות", style: "danger", onClick: doLogout }]
  });
}
async function doLogout() {
  const root = userRoot();
  if (root) {
    try { await Promise.race([update(ref(db, `${root}/presence/${DEVICE_ID}`), { online: false, lastSeen: serverTimestamp() }), wait(1500)]); } catch {}
  }
  teardown();
  await signOut(auth).catch(() => {});
}

/* ================= Login ================= */
function authErrorMessage(e) {
  const code = e?.code || "";
  const map = {
    "auth/popup-closed-by-user": null, "auth/cancelled-popup-request": null, "auth/user-cancelled": null,
    "auth/unauthorized-domain": ["הדומיין לא מאושר ב Firebase", `יש להוסיף את ${location.hostname} תחת Authentication, Settings, Authorized domains.`],
    "auth/network-request-failed": ["אין חיבור לרשת", "בדיקת החיבור ונסיון נוסף."],
    "auth/too-many-requests": ["יותר מדי נסיונות", "המתנה של כמה דקות ונסיון נוסף."],
    "auth/operation-not-allowed": ["התחברות Google כבויה", "יש להפעיל את Google תחת Authentication, Sign in method."],
    "auth/internal-error": ["שגיאה בתהליך ההתחברות", "נסיון נוסף. אם זה חוזר, הקוד למטה יעזור לאתר את הסיבה."]
  };
  if (code in map) return map[code];
  return ["ההתחברות נכשלה", "נסיון נוסף. אם זה חוזר, הקוד למטה יעזור לאתר את הסיבה."];
}
function showLoginError(e) {
  const msg = authErrorMessage(e), box = $("#login-error");
  if (!msg) { box.hidden = true; return; }
  box.innerHTML = `<b>${esc(msg[0])}</b>${esc(msg[1])}${e?.code ? `<br><code>${esc(e.code)}</code>` : ""}`;
  box.hidden = false;
}
function setLoginBusy(b) {
  $("#btn-login").disabled = b;
  $("#btn-login-label").textContent = b ? "מתחבר" : "התחברות עם Google";
}
async function login() {
  $("#login-error").hidden = true;
  setLoginBusy(true);
  try {
    await persistenceReady;
    await signInWithPopup(auth, provider);
  } catch (e) {
    const code = e?.code;
    if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") { /* user closed it */ }
    else if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/web-storage-unsupported"].includes(code)) {
      try { await signInWithRedirect(auth, provider); return; } catch (e2) { showLoginError(e2); }
    } else showLoginError(e);
  } finally { setLoginBusy(false); }
}
$("#btn-login").addEventListener("click", login);
persistenceReady.then(() => getRedirectResult(auth)).catch((e) => {
  if (!["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(e?.code)) showLoginError(e);
});
$("#btn-switch").addEventListener("click", async () => { await signOut(auth).catch(() => {}); });

/* ================= Realtime ================= */
let unsubs = [], session = 0, netTimer = null;
const isDenied = (e) => /permission[_ ]denied/i.test(`${e?.code || ""} ${e?.message || ""}`);
function teardown() {
  session++;
  stack.forEach(s => { try { s.destroy(); } catch {} });
  unsubs.forEach(u => { try { u(); } catch {} });
  unsubs = [];
  clearTimeout(netTimer);
  $("#net-banner").hidden = true;
  state.devices = {}; state.clips = []; state.items = []; state.connected = false;
  staged = null; sending = false;
  bodyCache.clear(); freshClips.clear();
}
function onDbError(e) { if (isDenied(e)) enterDenied(); else console.error(e); }
function setNet(on) {
  clearTimeout(netTimer);
  if (on) { $("#net-banner").hidden = true; return; }
  netTimer = setTimeout(() => { $("#net-banner").hidden = false; }, 2500);
}
function startRealtime() {
  const mine = session, root = userRoot();
  const meRef = ref(db, `${root}/presence/${DEVICE_ID}`);
  unsubs.push(onValue(ref(db, ".info/serverTimeOffset"), (s) => { state.serverOffset = s.val() || 0; }));
  unsubs.push(onValue(ref(db, ".info/connected"), async (snap) => {
    const on = snap.val() === true;
    state.connected = on; setNet(on); refreshScreens();
    if (!on || mine !== session) return;
    try {
      await onDisconnect(meRef).update({ online: false, lastSeen: serverTimestamp() });
      await update(meRef, { ...DEVICE, online: true, lastSeen: serverTimestamp() });
    } catch (e) { onDbError(e); }
  }));
  unsubs.push(onValue(ref(db, `${root}/presence`), (snap) => {
    state.devices = snap.val() || {};
    refreshScreens();
  }, onDbError));

  let firstItems = true, lastSeen = new Map();
  unsubs.push(onValue(ref(db, `${root}/items`), (snap) => {
    if (mine !== session) return;
    const list = Object.entries(snap.val() || {}).map(([id, it]) => ({ id, ...it }))
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    for (const it of list) {
      const vid = it.latest?.vid;
      if (!firstItems && vid && lastSeen.get(it.id) !== vid && it.latest.from !== DEVICE_ID) {
        toast(`גרסה ${it.latest.n} של ${it.name} התקבלה מהמכשיר ${it.latest.fromName || ""}`.trim());
        if ((it.latest.chars || 0) <= 500000) fetchRel(`versionsBody/${it.id}/${vid}`).catch(() => {});
      }
    }
    firstItems = false;
    lastSeen = new Map(list.map(it => [it.id, it.latest?.vid]));
    state.items = list;
    if (staged) staged.suggest = suggestItem(staged);
    refreshScreens();
  }, onDbError));

  let firstClips = true, known = new Set();
  unsubs.push(onValue(query(ref(db, `${root}/clipsMeta`), orderByKey(), limitToLast(50)), (snap) => {
    if (mine !== session) return;
    const val = snap.val() || {};
    const list = Object.entries(val).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.id < b.id ? 1 : -1));
    if (!firstClips) {
      for (const c of list) {
        if (known.has(c.id) || c.from === DEVICE_ID) continue;
        freshClips.add(c.id);
        setTimeout(() => { freshClips.delete(c.id); refreshScreens(); }, 6000);
        toast(`התקבל ${c.type || "טקסט"} מהמכשיר ${c.fromName || ""}`.trim());
      }
    }
    firstClips = false;
    known = new Set(list.map(c => c.id));
    state.clips = list;
    const newest = list.find(c => c.from !== DEVICE_ID);
    if (newest && (newest.chars || 0) <= 500000) fetchBody(newest.id).catch(() => {});
    refreshScreens();
  }, onDbError));
}
setInterval(() => { if (!stackEl.hidden) refreshScreens(); }, 30000);

/* ================= Screens switching ================= */
function showGate(id) {
  closeSheet();
  stackEl.hidden = true;
  $("#gate-login").hidden = id !== "login";
  $("#gate-denied").hidden = id !== "denied";
}
function showApp() {
  $("#gate-login").hidden = true;
  $("#gate-denied").hidden = true;
  stackEl.hidden = false;
}
function enterDenied() {
  teardown();
  $("#denied-email").textContent = auth.currentUser?.email || "";
  showGate("denied");
  hideSplash();
}
onAuthStateChanged(auth, (user) => {
  teardown();
  if (!user) { showGate("login"); hideSplash(); return; }
  showApp();
  resetTo("home");
  startRealtime();
  hideSplash();
});

/* ================= Zoom guard (iOS ignores user-scalable) ================= */
document.addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300 && !e.target.closest("button, a, input, textarea, select, [data-device]")) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

/* ================= Service worker ================= */
if ("serviceWorker" in navigator) {
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloading) { reloading = true; location.reload(); } });
  navigator.serviceWorker.register("/sw.js").then((reg) => {
    swReg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      nw?.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) offerUpdate(nw); });
    });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch((err) => console.warn("SW registration failed", err));
}
</script>
